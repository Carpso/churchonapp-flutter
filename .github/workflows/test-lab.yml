name: Firebase Test Lab (Real Devices)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  test-lab:
    name: 📱 Real-Device Instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Requires Firebase service account + project (add secrets to enable):
    #   GCLOUD_SERVICE_ACCOUNT  — service account JSON with Firebase Test Lab Admin
    #   FIREBASE_PROJECT_ID     — Firebase project id
    #   GOOGLE_SERVICES_JSON    — base64 android/app/google-services.json
    # secrets aren't allowed in `if:` — expose presence via job env instead.
    env:
      HAS_TESTLAB: ${{ secrets.GCLOUD_SERVICE_ACCOUNT != '' && secrets.FIREBASE_PROJECT_ID != '' }}
    steps:
      - name: Checkout repository
        if: env.HAS_TESTLAB == 'true'
        uses: actions/checkout@v4

      - name: Setup Flutter
        if: env.HAS_TESTLAB == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          cache: true

      - name: Setup Java
        if: env.HAS_TESTLAB == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install dependencies
        if: env.HAS_TESTLAB == 'true'
        run: flutter pub get

      - name: Create .env from example
        if: env.HAS_TESTLAB == 'true'
        run: cp .env.example .env

      - name: Materialize google-services.json
        if: env.HAS_TESTLAB == 'true'
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Build app APK (debug)
        if: env.HAS_TESTLAB == 'true'
        run: flutter build apk --debug

      - name: Build instrumentation test APK
        if: env.HAS_TESTLAB == 'true'
        run: flutter build apk --debug --target=integration_test/app_smoke_test.dart

      - name: Authenticate to Google Cloud
        if: env.HAS_TESTLAB == 'true'
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCLOUD_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}
          export_default_credentials: true

      - name: Run on Firebase Test Lab devices
        if: env.HAS_TESTLAB == 'true'
        run: |
          gcloud firebase test android run \
            --type instrumentation \
            --app build/app/outputs/apk/debug/app-debug.apk \
            --test build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device model=Pixel7,version=33,locale=en,orientation=portrait \
            --device model=Pixel5,version=30,locale=en,orientation=portrait \
            --device model=Pixel4a,version=28,locale=en,orientation=portrait \
            --timeout 20m \
            --results-dir=coa-smoke-$(date +%Y%m%d-%H%M%S) \
            --fail-fast

      - name: Notify Test Lab outcome
        if: always() && env.HAS_TESTLAB == 'true'
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Firebase Test Lab passed on all devices"
          else
            echo "❌ Firebase Test Lab failed — see results in Firebase Console"
            exit 1
          fi