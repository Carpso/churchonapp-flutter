name: Deploy Web

on:
  workflow_dispatch:
  # PAUSED 2026-09-06: automatic deploy disabled to stop building — uncomment push to resume.
  # push:
  #   branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Check Cloudflare secrets
        if: env.HAS_CF != 'true'
        run: echo "::warning::Cloudflare secrets (CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID) not configured - web deploy skipped"

      - uses: actions/checkout@v4
        if: env.HAS_CF == 'true'

      - name: Setup Flutter
        if: env.HAS_CF == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'

      # .env is gitignored but bundled as an asset — real values from the
      # ENV_FILE secret when set, else the example (never ship placeholder URL).
      - name: Materialize .env
        if: env.HAS_CF == 'true'
        run: |
          if [ -n "$ENV_FILE" ]; then printf '%s' "$ENV_FILE" > .env; else cp .env.example .env; fi
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      # The ENV_FILE secret is a snapshot of the local .env and can go stale.
      # supabase.churchonapp.com is fronted by a Worker that does NOT proxy
      # WebSocket upgrades, so /realtime/* 500s and every realtime feature
      # (live streaming, chat, prayer wall) silently dies. Fail loudly rather
      # than publishing a broken bundle.
      - name: Guard against the realtime-broken custom domain
        if: env.HAS_CF == 'true'
        run: |
          URL="$(grep -E '^SUPABASE_URL=' .env | cut -d= -f2- | tr -d '\r' | xargs)"
          echo "SUPABASE_URL=$URL"
          case "$URL" in
            *supabase.churchonapp.com*)
              echo "::error::SUPABASE_URL points at the custom domain, whose Worker breaks /realtime/* (CF 1101). Use the project URL."
              exit 1
              ;;
            *your-project*)
              echo "::error::SUPABASE_URL is still the placeholder. Set the ENV_FILE secret."
              exit 1
              ;;
          esac
          echo "SUPABASE_URL looks safe."

      - name: Install dependencies
        if: env.HAS_CF == 'true'
        run: flutter pub get

      - name: Build web
        if: env.HAS_CF == 'true'
        run: flutter build web --release --dart-define=FLUTTER_WEB_CANVASKIT_URL=

      # Pages Functions (OG/SEO meta injection for /church/, /site/, /c/ URLs)
      # must live next to the deploy directory — wrangler only picks up a
      # `functions/` folder when the deploy command runs with that as CWD.
      - name: Copy Pages Functions into build output
        if: env.HAS_CF == 'true'
        run: |
          cp -r web/functions build/web/functions

      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --cwd build/web --project-name churchonapp --branch main