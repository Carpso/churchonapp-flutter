name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Check Cloudflare secrets
        if: env.HAS_CF != 'true'
        run: echo "::warning::Cloudflare secrets (CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID) not configured - web deploy skipped"

      - uses: actions/checkout@v4
        if: env.HAS_CF == 'true'

      - name: Setup Flutter
        if: env.HAS_CF == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # .env is gitignored but bundled as an asset — create it from the committed example
      - name: Create .env from example
        if: env.HAS_CF == 'true'
        run: cp .env.example .env

      - name: Install dependencies
        if: env.HAS_CF == 'true'
        run: flutter pub get

      - name: Build web
        if: env.HAS_CF == 'true'
        run: flutter build web --release --dart-define=FLUTTER_WEB_CANVASKIT_URL=

      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name churchonapp --branch main