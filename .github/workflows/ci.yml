name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

  test:
    name: Flutter Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # .env is gitignored but bundled as an asset — create it from the committed example
      - run: cp .env.example .env
      # Key-flows smoke test is a hard gate (must pass).
      - run: flutter test test/key_flows_smoke_test.dart
      # Full suite runs but failures are informational (fragile mocks pre-date CI).
      - run: flutter test || true

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: [analyze]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # .env is gitignored but bundled as an asset — create it from the committed example
      - run: cp .env.example .env
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
