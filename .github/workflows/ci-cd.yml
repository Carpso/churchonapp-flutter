            exit 1
          fi

      - name: Upload AAB artifact
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aab-release
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload mapping files
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mapping-files
          path: build/app/outputs/symbols/
          retention-days: 30

  # Deploy to Play Store (internal testing)
  deploy-play-store:
    name: 🚀 Deploy to Play Store (Internal)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-aab]
    env:
      HAS_PLAY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT != '' }}
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check Play service account secret
        if: env.HAS_PLAY != 'true'
        run: echo "::warning::GOOGLE_PLAY_SERVICE_ACCOUNT not configured - Play Store deploy skipped"

      - name: Download AAB
        if: env.HAS_PLAY == 'true'
        uses: actions/download-artifact@v4
        with:
          name: aab-release
          path: ./build

      - name: Upload to Play Store (Internal Testing)
        if: env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.churchonapp.churchonapp
          releaseFiles: build/app-release.aab
          track: internal
          status: completed
          inAppUpdatePriority: 2

      - name: Comment on PR/Commit
        if: success() && env.HAS_PLAY == 'true'
        run: |
          echo "✅ Successfully deployed to Play Store Internal Testing track"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Create GitHub Release
  create-release:
    name: 🏷️ Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-apk, build-aab]
    env:
      HAS_SIGNING: ${{ secrets.STORE_FILE != '' }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Check signing secret
        if: env.HAS_SIGNING != 'true'
        run: echo "::warning::STORE_FILE not configured - GitHub Release skipped"

      - name: Download APK
        if: env.HAS_SIGNING == 'true'
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: ./apk

      - name: Download AAB
        if: env.HAS_SIGNING == 'true'
        uses: actions/download-artifact@v4
        with:
          name: aab-release
          path: ./aab

      - name: Generate changelog from git history
        if: env.HAS_SIGNING == 'true'
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            git log --oneline -30 > RELEASE_NOTES.md
          else
            git log --oneline ${PREV_TAG}..HEAD > RELEASE_NOTES.md
          fi
          echo "--- Release notes (last ${PREV_TAG:-30 commits}) ---"
          cat RELEASE_NOTES.md

      - name: Create Release
        if: env.HAS_SIGNING == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            apk/app-release.apk
            aab/app-release.aab

  # Instant tester distribution — push the APK to Firebase App Distribution
  # the moment code lands on main (no manual emailing of builds).
  distribute-firebase:
    name: 📲 Firebase App Distribution (OTA)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-apk]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      # secrets aren't allowed in `if:` — expose presence via job env instead.
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.FIREBASE_ANDROID_APP_ID != '' }}
    steps:
      - name: Checkout repository
        if: env.HAS_FIREBASE == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK
        if: env.HAS_FIREBASE == 'true'
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: ./apk

      - name: Generate changelog from git history
        if: env.HAS_FIREBASE == 'true'
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            git log --oneline -20 > RELEASE_NOTES.md
          else
            git log --oneline ${PREV_TAG}..HEAD > RELEASE_NOTES.md
          fi

      - name: Materialize Firebase SA key
        if: env.HAS_FIREBASE == 'true'
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > firebase-sa.json

      - name: Distribute to Firebase App Distribution
        if: env.HAS_FIREBASE == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFile: firebase-sa.json
          groups: ${{ secrets.FIREBASE_TESTER_GROUPS }}
          file: apk/app-release.apk
          releaseNotesFile: RELEASE_NOTES.md

      - name: Remove Firebase SA key
        if: always() && env.HAS_FIREBASE == 'true'
        run: rm -f firebase-sa.json

  # Upload the built APK + AAB to Google Drive (service account) so the team
  # can grab the latest builds on personal devices. Gated on GOOGLE_DRIVE_SA —
  # skipped with a warning when the secret is unset.
  upload-drive:
    name: 🚀 Upload Builds to Google Drive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-apk, build-aab]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      HAS_DRIVE: ${{ secrets.GOOGLE_DRIVE_SA != '' }}
    steps:
      - name: Check Drive secret
        if: env.HAS_DRIVE != 'true'
        run: echo "::warning::GOOGLE_DRIVE_SA not configured - Google Drive upload skipped"

      - name: Download APK artifact
        if: env.HAS_DRIVE == 'true'
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: ./artifacts

      - name: Download AAB artifact
        if: env.HAS_DRIVE == 'true'
        uses: actions/download-artifact@v4
        with:
          name: aab-release
          path: ./artifacts

      - name: Install rclone
        if: env.HAS_DRIVE == 'true'
        run: |
          curl -fsSL -o rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -qo rclone.zip
          sudo cp rclone-*-linux-amd64/rclone /usr/local/bin/rclone
          rclone version

      - name: Configure rclone with Drive service account
        if: env.HAS_DRIVE == 'true'
        run: |
          echo "${{ secrets.GOOGLE_DRIVE_SA }}" | base64 -d > drive-sa.json
          if [ -n "$DRIVE_FOLDER_ID" ]; then
            rclone config create gdrive drive service_account_file drive-sa.json root_folder_id "$DRIVE_FOLDER_ID"
          else
            rclone config create gdrive drive service_account_file drive-sa.json
          fi
        env:
          DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}

      - name: Upload APK + AAB to Google Drive
        if: env.HAS_DRIVE == 'true'
        run: |
          DEST="ChurchOnApp-builds/$(date -u +%Y-%m-%d)-${GITHUB_SHA:0:7}"
          rclone copy artifacts "gdrive:$DEST" -v

      - name: Remove Drive SA key
        if: always() && env.HAS_DRIVE == 'true'
        run: rm -f drive-sa.json

  # Notify on failure
  notify-failure:
    name: 🔔 Notify on Failure
    runs-on: ubuntu-latest
    if: failure()
    needs: [analyze, test, build-apk, build-aab]
    env:
      HAS_SLACK: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
      HAS_DISCORD: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
    steps:
      - name: Notify Slack
        if: env.HAS_SLACK == 'true'
        uses: slackapi/slack-github-action@v2
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {"text":"❌ CI/CD FAILED for ${{ github.repository }} (${{ github.ref_name }})\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\nCommit: ${{ github.sha }}"}
      - name: Notify Discord
        if: env.HAS_DISCORD == 'true' && env.HAS_SLACK != 'true'
        run: |
          curl -s -X POST -H "Content-Type: application/json" \
            -d '{"content":"❌ CI/CD FAILED for ${{ github.repository }} (${{ github.ref_name }})\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Fallback (no webhook configured)
        if: env.HAS_SLACK != 'true' && env.HAS_DISCORD != 'true'
        run: |
          echo "❌ Build failed! Check the Actions tab for details."
          echo "Workflow: ${{ github.workflow }}"
          echo "Run: ${{ github.run_id }}"
          echo "Commit: ${{ github.sha }}"

  # Success notification
  notify-success:
    name: ✅ Notify on Success
    runs-on: ubuntu-latest
    if: success()
    needs: [analyze, test, build-apk, build-aab]
    env:
      HAS_SLACK: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
      HAS_DISCORD: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
    steps:
      - name: Notify Slack
        if: env.HAS_SLACK == 'true'
        uses: slackapi/slack-github-action@v2
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {"text":"✅ CI/CD PASSED for ${{ github.repository }} (${{ github.ref_name }}) — APK/AAB artifacts ready.\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
      - name: Notify Discord
        if: env.HAS_DISCORD == 'true' && env.HAS_SLACK != 'true'
        run: |
          curl -s -X POST -H "Content-Type: application/json" \
            -d '{"content":"✅ CI/CD PASSED for ${{ github.repository }} (${{ github.ref_name }}) — APK/AAB artifacts ready.\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Fallback (no webhook configured)
        if: env.HAS_SLACK != 'true' && env.HAS_DISCORD != 'true'
        run: |
          echo "✅ All checks passed!"
          echo "Build artifacts are ready for deployment."