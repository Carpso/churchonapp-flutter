name: Church On App - CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - apk
          - aab
      release:
        description: 'Create release'
        required: false
        default: false
        type: boolean

env:
  JAVA_VERSION: '21'
  FLUTTER_VERSION: '3.35.1'

jobs:
  # Linting and static analysis
  analyze:
    name: 🔍 Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Materialize .env (real values from ENV_FILE secret; example fallback)
        run: |
          if [ -n "$ENV_FILE" ]; then printf '%s' "$ENV_FILE" > .env; else cp .env.example .env; fi
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: Run Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Check formatting (informational)
        run: dart format --output=none --set-exit-if-changed . || true

  # Unit and widget tests
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Materialize .env (real values from ENV_FILE secret; example fallback)
        run: |
          if [ -n "$ENV_FILE" ]; then printf '%s' "$ENV_FILE" > .env; else cp .env.example .env; fi
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: Run key-flows smoke test (hard gate)
        run: flutter test test/key_flows_smoke_test.dart

      - name: Run full suite (informational)
        run: flutter test || true

  # Build Android APK
  build-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [analyze, test]
    env:
      HAS_SIGNING: ${{ secrets.STORE_FILE != '' && secrets.GOOGLE_SERVICES_JSON != '' }}
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'apk'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: flutter pub get

      - name: Materialize .env (real values from ENV_FILE secret; example fallback)
        run: |
          if [ -n "$ENV_FILE" ]; then printf '%s' "$ENV_FILE" > .env; else cp .env.example .env; fi
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: Check signing secrets
        if: env.HAS_SIGNING != 'true'
        run: echo "::warning::Signing secrets (STORE_FILE/GOOGLE_SERVICES_JSON) not configured - APK build skipped"

      - name: Materialize google-services.json from secret
        if: env.HAS_SIGNING == 'true'
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Materialize upload keystore from secret
        if: env.HAS_SIGNING == 'true'
        run: echo "${{ secrets.STORE_FILE }}" | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        if: env.HAS_SIGNING == 'true'
        run: |
          echo "storeFile=upload-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

      - name: Compute semantic version
        id: semver
        env:
          PLAY_SA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          VERSION_NAME="1.0.0"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi
          BUILD_NUMBER=0
          if [ -n "$PLAY_SA" ]; then
            echo "$PLAY_SA" > /tmp/play-sa.json
            sed -i 's/\r$//' /tmp/play-sa.json
            SI=$(python3 -c "import json,base64,time;sa=json.load(open('/tmp/play-sa.json'));e=lambda d:base64.urlsafe_b64encode(json.dumps(d,separators=(',',':')).encode()).rstrip(b'=').decode();print(e({'alg':'RS256','typ':'JWT'})+'.'+e({'iss':sa['client_email'],'scope':'https://www.googleapis.com/auth/androidpublisher','aud':'https://oauth2.googleapis.com/token','iat':int(time.time()),'exp':int(time.time())+3600}))")
            PK=$(python3 -c "import json;print(json.load(open('/tmp/play-sa.json'))['private_key'])")
            printf '%s' "$PK" > /tmp/play-key.pem
            SIG=$(printf '%s' "$SI" | openssl dgst -sha256 -sign /tmp/play-key.pem -binary | base64 -w0 | tr '+/' '-_' | tr -d '=')
            JWT="$SI.$SIG"
            TOKEN=$(curl -s --max-time 20 -X POST --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer" --data-urlencode "assertion=$JWT" https://oauth2.googleapis.com/token | python3 -c "import sys,json;print(json.load(sys.stdin).get('access_token',''))")
            echo "play token length: ${#TOKEN}"
            MAX=0
            FOUND=0
            if [ -n "$TOKEN" ]; then
              for track in production internal alpha beta; do
                CODE=$(curl -sf --max-time 20 -H "Authorization: Bearer $TOKEN" "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.churchonapp.churchonapp/tracks/$track" 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);c=[int(x) for r in d.get('releases',[]) for x in (r.get('versionCodes') or [])];print(max(c) if c else 0)" 2>/dev/null) || CODE=-1
                echo "$track track max: $CODE"
                if [ "$CODE" != "-1" ]; then
                  FOUND=1
                  [ "$CODE" -gt "$MAX" ] && MAX=$CODE
                fi
              done
            else
              echo "WARNING: could not mint Play access token"
            fi
            if [ "$FOUND" = "1" ]; then
              BUILD_NUMBER=$((MAX + 1))
            else
              echo "WARNING: Play track queries failed - falling back to pubspec"
              BUILD_NUMBER=$(sed -n 's/^version: [0-9.]*+//p' pubspec.yaml | head -1)
              BUILD_NUMBER=${BUILD_NUMBER:-0}
              BUILD_NUMBER=$((BUILD_NUMBER + 1))
            fi
          else
            echo "WARNING: GOOGLE_PLAY_SERVICE_ACCOUNT not set - falling back to pubspec"
            BUILD_NUMBER=$(sed -n 's/^version: [0-9.]*+//p' pubspec.yaml | head -1)
            BUILD_NUMBER=${BUILD_NUMBER:-0}
            BUILD_NUMBER=$((BUILD_NUMBER + 1))
          fi
          if [ "$BUILD_NUMBER" -le 0 ]; then
            BUILD_NUMBER=1
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Computed version ${VERSION_NAME}+${BUILD_NUMBER}"

      - name: Update pubspec version
        run: |
          sed -i "s/version: .*/version: ${VERSION_NAME}+${BUILD_NUMBER}/" pubspec.yaml
          echo "Updated pubspec.yaml to version ${VERSION_NAME}+${BUILD_NUMBER}"
        env:
          VERSION_NAME: ${{ steps.semver.outputs.VERSION_NAME }}
          BUILD_NUMBER: ${{ steps.semver.outputs.BUILD_NUMBER }}

      - name: Free disk space
        if: env.HAS_SIGNING == 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Check runner resources
        if: env.HAS_SIGNING == 'true'
        run: |
          echo "nproc: $(nproc)"
          echo "MEM: $(free -m | awk '/Mem:/{print $2"MiB total, "$3"MiB used"}')"
          echo "DISK: $(df -h / | awk 'NR==2{print $4" free of "$2}')"

      - name: Build APK
        id: build_apk
        if: env.HAS_SIGNING == 'true'
        continue-on-error: true
        run: |
          ( i=0; while [ $i -lt 200 ]; do echo "HEARTBEAT $(date -u +%H:%M:%S) mem:$(free -m | awk '/Mem:/{print $3"MiB/"$2"MiB"}') disk:$(df -h / | awk 'NR==2{print $4}')"; sleep 20; i=$((i+1)); done ) >&2 &
          flutter build apk --release \
            --build-name=${{ steps.semver.outputs.VERSION_NAME }} \
            --build-number=${{ steps.semver.outputs.BUILD_NUMBER }} \
            --obfuscate --split-debug-info=build/app/outputs/symbols \
            > /tmp/apk_build.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Fail if APK build failed
        if: env.HAS_SIGNING == 'true' && steps.build_apk.outputs.exit != '0'
        run: |
          echo "APK build exited ${{ steps.build_apk.outputs.exit }}"
          echo "--- last 120 lines ---"
          tail -120 /tmp/apk_build.log
          exit 1

      - name: Upload APK build log
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-log
          path: /tmp/apk_build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify APK
        if: env.HAS_SIGNING == 'true'
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            echo "APK found at $APK_PATH"
            ls -lh "$APK_PATH"
            echo "APK_SIZE=$(stat -c%s "$APK_PATH")" >> $GITHUB_OUTPUT
          else
            echo "APK not found!"
            exit 1
          fi

      - name: Upload APK artifact
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload mapping files
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mapping-files
          path: build/app/outputs/symbols/
          retention-days: 30

  # Build Android App Bundle (AAB)
  build-aab:
    name: 📦 Build Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [analyze, test]
    env:
      HAS_SIGNING: ${{ secrets.STORE_FILE != '' && secrets.GOOGLE_SERVICES_JSON != '' }}
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'aab'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: flutter pub get

      - name: Materialize .env (real values from ENV_FILE secret; example fallback)
        run: |
          if [ -n "$ENV_FILE" ]; then printf '%s' "$ENV_FILE" > .env; else cp .env.example .env; fi
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: Check signing secrets
        if: env.HAS_SIGNING != 'true'
        run: echo "::warning::Signing secrets (STORE_FILE/GOOGLE_SERVICES_JSON) not configured - AAB build skipped"

      - name: Materialize google-services.json from secret
        if: env.HAS_SIGNING == 'true'
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Materialize upload keystore from secret
        if: env.HAS_SIGNING == 'true'
        run: echo "${{ secrets.STORE_FILE }}" | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        if: env.HAS_SIGNING == 'true'
        run: |
          echo "storeFile=upload-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

      - name: Compute semantic version
        id: semver
        env:
          PLAY_SA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          VERSION_NAME="1.0.0"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi
          BUILD_NUMBER=0
          if [ -n "$PLAY_SA" ]; then
            echo "$PLAY_SA" > /tmp/play-sa.json
            sed -i 's/\r$//' /tmp/play-sa.json
            SI=$(python3 -c "import json,base64,time;sa=json.load(open('/tmp/play-sa.json'));e=lambda d:base64.urlsafe_b64encode(json.dumps(d,separators=(',',':')).encode()).rstrip(b'=').decode();print(e({'alg':'RS256','typ':'JWT'})+'.'+e({'iss':sa['client_email'],'scope':'https://www.googleapis.com/auth/androidpublisher','aud':'https://oauth2.googleapis.com/token','iat':int(time.time()),'exp':int(time.time())+3600}))")
            PK=$(python3 -c "import json;print(json.load(open('/tmp/play-sa.json'))['private_key'])")
            printf '%s' "$PK" > /tmp/play-key.pem
            SIG=$(printf '%s' "$SI" | openssl dgst -sha256 -sign /tmp/play-key.pem -binary | base64 -w0 | tr '+/' '-_' | tr -d '=')
            JWT="$SI.$SIG"
            TOKEN=$(curl -s --max-time 20 -X POST --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer" --data-urlencode "assertion=$JWT" https://oauth2.googleapis.com/token | python3 -c "import sys,json;print(json.load(sys.stdin).get('access_token',''))")
            echo "play token length: ${#TOKEN}"
            MAX=0
            FOUND=0
            if [ -n "$TOKEN" ]; then
              for track in production internal alpha beta; do
                CODE=$(curl -sf --max-time 20 -H "Authorization: Bearer $TOKEN" "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.churchonapp.churchonapp/tracks/$track" 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);c=[int(x) for r in d.get('releases',[]) for x in (r.get('versionCodes') or [])];print(max(c) if c else 0)" 2>/dev/null) || CODE=-1
                echo "$track track max: $CODE"
                if [ "$CODE" != "-1" ]; then
                  FOUND=1
                  [ "$CODE" -gt "$MAX" ] && MAX=$CODE
                fi
              done
            else
              echo "WARNING: could not mint Play access token"
            fi
            if [ "$FOUND" = "1" ]; then
              BUILD_NUMBER=$((MAX + 1))
            else
              echo "WARNING: Play track queries failed - falling back to pubspec"
              BUILD_NUMBER=$(sed -n 's/^version: [0-9.]*+//p' pubspec.yaml | head -1)
              BUILD_NUMBER=${BUILD_NUMBER:-0}
              BUILD_NUMBER=$((BUILD_NUMBER + 1))
            fi
          else
            echo "WARNING: GOOGLE_PLAY_SERVICE_ACCOUNT not set - falling back to pubspec"
            BUILD_NUMBER=$(sed -n 's/^version: [0-9.]*+//p' pubspec.yaml | head -1)
            BUILD_NUMBER=${BUILD_NUMBER:-0}
            BUILD_NUMBER=$((BUILD_NUMBER + 1))
          fi
          if [ "$BUILD_NUMBER" -le 0 ]; then
            BUILD_NUMBER=1
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Computed version ${VERSION_NAME}+${BUILD_NUMBER}"

      - name: Update pubspec version
        run: |
          sed -i "s/version: .*/version: ${VERSION_NAME}+${BUILD_NUMBER}/" pubspec.yaml
          echo "Updated pubspec.yaml to version ${VERSION_NAME}+${BUILD_NUMBER}"
        env:
          VERSION_NAME: ${{ steps.semver.outputs.VERSION_NAME }}
          BUILD_NUMBER: ${{ steps.semver.outputs.BUILD_NUMBER }}

      - name: Free disk space
        if: env.HAS_SIGNING == 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Check runner resources
        if: env.HAS_SIGNING == 'true'
        run: |
          echo "nproc: $(nproc)"
          echo "MEM: $(free -m | awk '/Mem:/{print $2"MiB total, "$3"MiB used"}')"
          echo "DISK: $(df -h / | awk 'NR==2{print $4" free of "$2}')"

      - name: Build AAB
        id: build_aab
        if: env.HAS_SIGNING == 'true'
        continue-on-error: true
        run: |
          ( i=0; while [ $i -lt 200 ]; do echo "HEARTBEAT $(date -u +%H:%M:%S) mem:$(free -m | awk '/Mem:/{print $3"MiB/"$2"MiB"}') disk:$(df -h / | awk 'NR==2{print $4}')"; sleep 20; i=$((i+1)); done ) >&2 &
          flutter build appbundle --release \
            --build-name=${{ steps.semver.outputs.VERSION_NAME }} \
            --build-number=${{ steps.semver.outputs.BUILD_NUMBER }} \
            --obfuscate --split-debug-info=build/app/outputs/symbols \
            > /tmp/aab_build.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Fail if AAB build failed
        if: env.HAS_SIGNING == 'true' && steps.build_aab.outputs.exit != '0'
        run: |
          echo "AAB build exited ${{ steps.build_aab.outputs.exit }}"
          echo "--- last 120 lines ---"
          tail -120 /tmp/aab_build.log
          exit 1

