name: Church On App - CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - apk
          - aab
      release:
        description: 'Create release'
        required: false
        default: false
        type: boolean

env:
  JAVA_VERSION: '21'
  FLUTTER_VERSION: '3.35.1'

jobs:
  # Linting and static analysis
  analyze:
    name: 🔍 Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env from example
        run: cp .env.example .env

      - name: Run Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Check formatting (informational)
        run: dart format --output=none --set-exit-if-changed . || true

  # Unit and widget tests
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env from example
        run: cp .env.example .env

      - name: Run key-flows smoke test (hard gate)
        run: flutter test test/key_flows_smoke_test.dart

      - name: Run full suite (informational)
        run: flutter test || true

  # Build Android APK
  build-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [analyze, test]
    env:
      HAS_SIGNING: ${{ secrets.STORE_FILE != '' && secrets.GOOGLE_SERVICES_JSON != '' }}
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'apk'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env from example
        run: cp .env.example .env

      - name: Check signing secrets
        if: env.HAS_SIGNING != 'true'
        run: echo "::warning::Signing secrets (STORE_FILE/GOOGLE_SERVICES_JSON) not configured - APK build skipped"

      - name: Materialize google-services.json from secret
        if: env.HAS_SIGNING == 'true'
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Materialize upload keystore from secret
        if: env.HAS_SIGNING == 'true'
        run: echo "${{ secrets.STORE_FILE }}" | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        if: env.HAS_SIGNING == 'true'
        run: |
          echo "storeFile=upload-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

      - name: Compute semantic version
        id: semver
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          VERSION_NAME="1.0.0"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Update pubspec version
        run: |
          sed -i "s/version: .*/version: ${VERSION_NAME}+${BUILD_NUMBER}/" pubspec.yaml
          echo "Updated pubspec.yaml to version ${VERSION_NAME}+${BUILD_NUMBER}"
        env:
          VERSION_NAME: ${{ steps.semver.outputs.VERSION_NAME }}
          BUILD_NUMBER: ${{ steps.semver.outputs.BUILD_NUMBER }}

      - name: Free disk space
        if: env.HAS_SIGNING == 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Check runner resources
        if: env.HAS_SIGNING == 'true'
        run: |
          echo "nproc: $(nproc)"
          echo "MEM: $(free -m | awk '/Mem:/{print $2"MiB total, "$3"MiB used"}')"
          echo "DISK: $(df -h / | awk 'NR==2{print $4" free of "$2}')"

      - name: Build APK
        id: build_apk
        if: env.HAS_SIGNING == 'true'
        continue-on-error: true
        run: |
          ( i=0; while [ $i -lt 200 ]; do echo "HEARTBEAT $(date -u +%H:%M:%S) mem:$(free -m | awk '/Mem:/{print $3"MiB/"$2"MiB"}') disk:$(df -h / | awk 'NR==2{print $4}')"; sleep 20; i=$((i+1)); done ) >&2 &
          flutter build apk --release \
            --build-name=${{ steps.semver.outputs.VERSION_NAME }} \
            --build-number=${{ steps.semver.outputs.BUILD_NUMBER }} \
            --obfuscate --split-debug-info=build/app/outputs/symbols \
            > /tmp/apk_build.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Fail if APK build failed
        if: env.HAS_SIGNING == 'true' && steps.build_apk.outputs.exit != '0'
        run: |
          echo "APK build exited ${{ steps.build_apk.outputs.exit }}"
          echo "--- last 120 lines ---"
          tail -120 /tmp/apk_build.log
          exit 1

      - name: Upload APK build log
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-log
          path: /tmp/apk_build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify APK
        if: env.HAS_SIGNING == 'true'
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            echo "APK found at $APK_PATH"
            ls -lh "$APK_PATH"
            echo "APK_SIZE=$(stat -c%s "$APK_PATH")" >> $GITHUB_OUTPUT
          else
            echo "APK not found!"
            exit 1
          fi

      - name: Upload APK artifact
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload mapping files
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mapping-files
          path: build/app/outputs/symbols/
          retention-days: 30

  # Build Android App Bundle (AAB)
  build-aab:
    name: 📦 Build Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [analyze, test]
    env:
      HAS_SIGNING: ${{ secrets.STORE_FILE != '' && secrets.GOOGLE_SERVICES_JSON != '' }}
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'aab'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env from example
        run: cp .env.example .env

      - name: Check signing secrets
        if: env.HAS_SIGNING != 'true'
        run: echo "::warning::Signing secrets (STORE_FILE/GOOGLE_SERVICES_JSON) not configured - AAB build skipped"

      - name: Materialize google-services.json from secret
        if: env.HAS_SIGNING == 'true'
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Materialize upload keystore from secret
        if: env.HAS_SIGNING == 'true'
        run: echo "${{ secrets.STORE_FILE }}" | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        if: env.HAS_SIGNING == 'true'
        run: |
          echo "storeFile=upload-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

      - name: Compute semantic version
        id: semver
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          VERSION_NAME="1.0.0"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Update pubspec version
        run: |
          sed -i "s/version: .*/version: ${VERSION_NAME}+${BUILD_NUMBER}/" pubspec.yaml
          echo "Updated pubspec.yaml to version ${VERSION_NAME}+${BUILD_NUMBER}"
        env:
          VERSION_NAME: ${{ steps.semver.outputs.VERSION_NAME }}
          BUILD_NUMBER: ${{ steps.semver.outputs.BUILD_NUMBER }}

      - name: Free disk space
        if: env.HAS_SIGNING == 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Check runner resources
        if: env.HAS_SIGNING == 'true'
        run: |
          echo "nproc: $(nproc)"
          echo "MEM: $(free -m | awk '/Mem:/{print $2"MiB total, "$3"MiB used"}')"
          echo "DISK: $(df -h / | awk 'NR==2{print $4" free of "$2}')"

      - name: Build AAB
        id: build_aab
        if: env.HAS_SIGNING == 'true'
        continue-on-error: true
        run: |
          ( i=0; while [ $i -lt 200 ]; do echo "HEARTBEAT $(date -u +%H:%M:%S) mem:$(free -m | awk '/Mem:/{print $3"MiB/"$2"MiB"}') disk:$(df -h / | awk 'NR==2{print $4}')"; sleep 20; i=$((i+1)); done ) >&2 &
          flutter build appbundle --release \
            --build-name=${{ steps.semver.outputs.VERSION_NAME }} \
            --build-number=${{ steps.semver.outputs.BUILD_NUMBER }} \
            --obfuscate --split-debug-info=build/app/outputs/symbols \
            > /tmp/aab_build.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Fail if AAB build failed
        if: env.HAS_SIGNING == 'true' && steps.build_aab.outputs.exit != '0'
        run: |
          echo "AAB build exited ${{ steps.build_aab.outputs.exit }}"
          echo "--- last 120 lines ---"
          tail -120 /tmp/aab_build.log
          exit 1

      - name: Upload AAB build log
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aab-build-log
          path: /tmp/aab_build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify AAB
        if: env.HAS_SIGNING == 'true'
        run: |
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          if [ -f "$AAB_PATH" ]; then
            echo "AAB found at $AAB_PATH"
            ls -lh "$AAB_PATH"
            echo "AAB_SIZE=$(stat -c%s "$AAB_PATH")" >> $GITHUB_OUTPUT
          else
            echo "AAB not found!"
            exit 1
          fi

      - name: Upload AAB artifact
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aab-release
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload mapping files
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mapping-files
          path: build/app/outputs/symbols/
          retention-days: 30

  # Build iOS (macOS runner required; unsigned so no Apple certs needed)
  build-ios:
    name: 🍎 Build iOS
    runs-on: macos-latest
    timeout-minutes: 60
    needs: [analyze, test]
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_type != 'apk'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env from example
        run: cp .env.example .env

      - name: Compute semantic version
        id: semver
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          VERSION_NAME="1.0.0"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Update pubspec version
        run: |
          sed -i '' "s/version: .*/version: ${VERSION_NAME}+${BUILD_NUMBER}/" pubspec.yaml
        env:
          VERSION_NAME: ${{ steps.semver.outputs.VERSION_NAME }}
          BUILD_NUMBER: ${{ steps.semver.outputs.BUILD_NUMBER }}

      - name: Build iOS (unsigned, simulator)
        run: |
          flutter build ios --simulator --no-codesign \
            --build-name=${{ steps.semver.outputs.VERSION_NAME }} \
            --build-number=${{ steps.semver.outputs.BUILD_NUMBER }}

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphonesimulator/Runner.app
          retention-days: 7

  # Deploy to Play Store (internal testing)
  deploy-play-store:
    name: 🚀 Deploy to Play Store (Internal)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-aab]
    env:
      HAS_PLAY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT != '' }}
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check Play service account secret
        if: env.HAS_PLAY != 'true'
        run: echo "::warning::GOOGLE_PLAY_SERVICE_ACCOUNT not configured - Play Store deploy skipped"

      - name: Download AAB
        if: env.HAS_PLAY == 'true'
        uses: actions/download-artifact@v4
        with:
          name: aab-release
          path: ./build

      - name: Upload to Play Store (Internal Testing)
        if: env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.churchonapp.churchonapp
          releaseFiles: build/app-release.aab
          track: internal
          status: completed
          inAppUpdatePriority: 2

      - name: Comment on PR/Commit
        if: success() && env.HAS_PLAY == 'true'
        run: |
          echo "✅ Successfully deployed to Play Store Internal Testing track"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Create GitHub Release
  create-release:
    name: 🏷️ Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-apk, build-aab]
    env:
      HAS_SIGNING: ${{ secrets.STORE_FILE != '' }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Check signing secret
        if: env.HAS_SIGNING != 'true'
        run: echo "::warning::STORE_FILE not configured - GitHub Release skipped"

      - name: Download APK
        if: env.HAS_SIGNING == 'true'
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: ./apk

      - name: Download AAB
        if: env.HAS_SIGNING == 'true'
        uses: actions/download-artifact@v4
        with:
          name: aab-release
          path: ./aab

      - name: Generate changelog from git history
        if: env.HAS_SIGNING == 'true'
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            git log --oneline -30 > RELEASE_NOTES.md
          else
            git log --oneline ${PREV_TAG}..HEAD > RELEASE_NOTES.md
          fi
          echo "--- Release notes (last ${PREV_TAG:-30 commits}) ---"
          cat RELEASE_NOTES.md

      - name: Create Release
        if: env.HAS_SIGNING == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            apk/app-release.apk
            aab/app-release.aab

  # Instant tester distribution — push the APK to Firebase App Distribution
  # the moment code lands on main (no manual emailing of builds).
  distribute-firebase:
    name: 📲 Firebase App Distribution (OTA)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-apk]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.FIREBASE_ANDROID_APP_ID != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: ./apk

      - name: Generate changelog from git history
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            git log --oneline -20 > RELEASE_NOTES.md
          else
            git log --oneline ${PREV_TAG}..HEAD > RELEASE_NOTES.md
          fi

      - name: Distribute to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsJsonContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ secrets.FIREBASE_TESTER_GROUPS }}
          file: apk/app-release.apk
          releaseNotesFile: RELEASE_NOTES.md

  # Notify on failure
  notify-failure:
    name: 🔔 Notify on Failure
    runs-on: ubuntu-latest
    if: failure()
    needs: [analyze, test, build-apk, build-aab]
    env:
      HAS_SLACK: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
      HAS_DISCORD: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
    steps:
      - name: Notify Slack
        if: env.HAS_SLACK == 'true'
        uses: slackapi/slack-github-action@v2
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {"text":"❌ CI/CD FAILED for ${{ github.repository }} (${{ github.ref_name }})\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\nCommit: ${{ github.sha }}"}
      - name: Notify Discord
        if: env.HAS_DISCORD == 'true' && env.HAS_SLACK != 'true'
        run: |
          curl -s -X POST -H "Content-Type: application/json" \
            -d '{"content":"❌ CI/CD FAILED for ${{ github.repository }} (${{ github.ref_name }})\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Fallback (no webhook configured)
        if: env.HAS_SLACK != 'true' && env.HAS_DISCORD != 'true'
        run: |
          echo "❌ Build failed! Check the Actions tab for details."
          echo "Workflow: ${{ github.workflow }}"
          echo "Run: ${{ github.run_id }}"
          echo "Commit: ${{ github.sha }}"

  # Success notification
  notify-success:
    name: ✅ Notify on Success
    runs-on: ubuntu-latest
    if: success()
    needs: [analyze, test, build-apk, build-aab]
    env:
      HAS_SLACK: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
      HAS_DISCORD: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
    steps:
      - name: Notify Slack
        if: env.HAS_SLACK == 'true'
        uses: slackapi/slack-github-action@v2
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {"text":"✅ CI/CD PASSED for ${{ github.repository }} (${{ github.ref_name }}) — APK/AAB artifacts ready.\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
      - name: Notify Discord
        if: env.HAS_DISCORD == 'true' && env.HAS_SLACK != 'true'
        run: |
          curl -s -X POST -H "Content-Type: application/json" \
            -d '{"content":"✅ CI/CD PASSED for ${{ github.repository }} (${{ github.ref_name }}) — APK/AAB artifacts ready.\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Fallback (no webhook configured)
        if: env.HAS_SLACK != 'true' && env.HAS_DISCORD != 'true'
        run: |
          echo "✅ All checks passed!"
          echo "Build artifacts are ready for deployment."