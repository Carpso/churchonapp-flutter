  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var i = 0; i < regs.length; i++) regs[i].unregister();
      }).catch(function(e) { console.error('SW unregister failed: ' + e); });
    }
  </script>
  <script>
    (function() {
      var isFirebaseError = function(msg) {
        return msg && (msg.indexOf('DEFAULT') !== -1 || msg.indexOf('duplicate-app') !== -1);
      };
      window.addEventListener('error', function(e) {
        if (isFirebaseError(e.message)) { e.preventDefault(); e.stopImmediatePropagation(); return false; }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (isFirebaseError(e.reason && e.reason.message)) { e.preventDefault(); }
      });
    })();
  </script>
