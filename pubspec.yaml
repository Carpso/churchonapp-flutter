name: church_on_app
description: "Church On App — Flutter-based church management platform with Supabase backend. Covers digital giving, marketplace, media streaming, events, logistics, Bible study, social features, and admin tools."
publish_to: "none"

version: 1.0.0+286

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.2.1
  supabase_flutter: ^2.12.0
  google_fonts: ^8.0.1
  fl_chart: ^1.1.1
  google_generative_ai: ^0.4.0
  qr_flutter: ^4.1.0
  video_player: ^2.10.1
  chewie: ^1.13.0
  table_calendar: ^3.2.0
  flutter_staggered_grid_view: ^0.7.0
  lucide_icons: ^0.257.0
  http: ^1.6.0
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.2
  animations: ^2.1.1
  mobile_scanner: ^7.1.4
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_map: ^7.0.2
  vector_map_tiles: ^8.0.0
  vector_map_tiles_pmtiles: ^1.5.0
  vector_tile_renderer: ^5.2.1
  latlong2: ^0.9.1
  maplibre_gl: ^0.25.0
  flutter_dotenv: ^5.2.1
  camera: ^0.11.0
  flutter_webrtc: ^1.3.0
  audioplayers: ^6.0.0
  permission_handler: ^11.3.0
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  flutter_local_notifications: ^20.1.0
  pdf: ^3.11.1
  printing: ^5.13.2
  go_router: ^17.1.0
  app_links: ^6.4.1
  shimmer: ^3.0.0
  flutter_pdfview: ^1.4.4
  pdfrx: ^1.3.5
  flutter_cache_manager: ^3.4.1
  just_audio: ^0.10.5
  audio_service: ^0.18.18
  rxdart: ^0.28.0
  connectivity_plus: ^7.0.0
  connectivity_plus_platform_interface: ^2.0.1
  share_plus: ^12.0.2
  google_sign_in: 6.2.1
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  firebase_crashlytics: ^4.3.4
  firebase_analytics: ^11.5.4
  crypto: ^3.0.7
  encrypt: ^5.0.3
  uuid: ^4.5.1
  universal_io: ^2.2.2
  in_app_review: ^2.0.9
  flutter_tts: ^4.2.1
  video_compress: ^3.1.2
  package_info_plus: ^9.0.0
  device_info_plus: ^11.3.0
  showcaseview: ^3.0.0
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  mocktail: ^1.0.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon_512.png"
  adaptive_icon_round: true
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/app_logo.png
    - assets/images/google_g.png
    - assets/logo_airtel.png
    - assets/logo_mtn.png
    - assets/logo_zamtel.png
    - assets/offline_bible_data.json
    - assets/strongs/hebrew.json
    - assets/strongs/greek.json
