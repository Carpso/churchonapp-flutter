[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["churchonapp://callback", "https://churchonapp.com/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_confirmations = false

[storage]
enabled = true

[edge_runtime]
enabled = true
policy = "per_worker"

[analytics]
enabled = false

[experimental]
orioledb_version = ""
